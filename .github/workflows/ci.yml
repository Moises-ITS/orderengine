name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles, runs the 40 JUnit tests and builds target/orderengine.jar.
      - name: Build and test
        run: ./mvnw -B verify
        shell: bash

      - name: Replay the example feed
        run: java -jar target/orderengine.jar --feed examples/feed.txt

      # Small enough to keep CI quick, large enough to catch a regression that
      # only shows up under load. CI runners are too noisy for latency numbers.
      - name: Smoke benchmark
        run: java -jar target/orderengine.jar --bench 200000
